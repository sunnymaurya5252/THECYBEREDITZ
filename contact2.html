<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffcc;
            --primary-light: rgba(0, 255, 204, 0.1);
            --bg: #0a0e17;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #1f2937;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-container {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary-light);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--accent);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: var(--bg);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-wrapper i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .file-upload-wrapper p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .file-upload-wrapper #file-name {
            display: block;
            margin-top: 10px;
            color: #fff;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        @media (max-width: 600px) {
            .contact-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h2 class="section-title">Get In Touch</h2>
        <p class="section-subtitle">Have a project or a video to share? Send a message.</p>

        <!-- Replace YOUR_FORM_ENDPOINT with your actual form processing link like Formspree -->
        <form action=""https://docs.google.com/forms/d/e/1FAIpQLScH1KtDri-ZI1yjJdxLWbJCnYKL7KntD0c_gRTFAwUpF43jCA/viewform?embedded=true" width="640" height="1109" frameborder="0" marginheight="0" marginwidth="0"></iframe>">
            
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Sunny Maurya" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="sunny@gmail.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell me about your inquiry or project details..." required></textarea>
            </div>
            <div class="form-group">
                <label>Upload Image</label>
                <div class="file-upload-wrapper">
                    <i class="fa-solid fa-image"></i>
                    <p>select your image</p>
                    <input type="file" id="image-upload" name="image" accept="image/*">
               
                </div>
             </div>


            <div class="form-group">
                <label>Upload Video</label>
                <div class="file-upload-wrapper" id="drop-zone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Drag and drop your video here and max size of file 9GB or <strong>click to browse</strong></p>
                    <input type="file" id="video-upload" name="video" accept="video/*">
                    <span id="file-name"></span>
                </div>
            </div>
            

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('video-upload');
        const fileNameSpan = document.getElementById('file-name');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                fileNameSpan.textContent = "Selected file: " + this.files[0].name;
            } else {
                fileNameSpan.textContent = "";
            }
        });
    </script>

</body>
</html>
