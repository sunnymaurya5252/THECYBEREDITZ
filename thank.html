<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | The Cyber Editz</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #00e5ff;
            --secondary-color: #8a2be2;
            --text-color: #ffffff;
            --font-family: 'Nirmala UI', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            background: radial-gradient(circle at center, #161b22 0%, #0d1117 100%);
        }

        .container {
            max-width: 600px;
            padding: 40px;
            border: 1px solid var(--secondary-color);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2), 0 0 40px rgba(138, 43, 226, 0.2);
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #c9d1d9;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Message Received!</h1>
        <p>Thank you for reaching out to <strong>The Cyber Editz</strong>. Your message is safely in our system. I am already reviewing your request and will get back to you shortly.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
